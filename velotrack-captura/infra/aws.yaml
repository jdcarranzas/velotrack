AWSTemplateFormatVersion: "2010-09-09"
Description: VeloTrack Captura - prototipo EC2 con Docker, TimescaleDB y acceso privado por SSM
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC existente
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Subred publica de esa VPC con ruta a Internet Gateway y DNS habilitado
  InstanceType:
    Type: String
    Default: t3.medium
    AllowedValues: [t3.medium, t3.large]
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub "${ArtifactBucket.Arn}/*"
            Condition:
              Bool: {aws:SecureTransport: "false"}
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"
      Policies:
        - PolicyName: DownloadPrototype
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${ArtifactBucket.Arn}/*"
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Sin puertos de entrada - administracion y API mediante SSM
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      NetworkInterfaces:
        - DeviceIndex: "0"
          AssociatePublicIpAddress: true
          SubnetId: !Ref SubnetId
          GroupSet: [!Ref SecurityGroup]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            Encrypted: true
            VolumeSize: 30
            VolumeType: gp3
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: velotrack-captura-prototipo
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euo pipefail
          dnf install -y docker unzip openssl
          systemctl enable --now docker
          mkdir -p /usr/local/lib/docker/cli-plugins /opt/velotrack
          cd /tmp
          curl --fail --location --retry 3 -o docker-compose-linux-x86_64 https://github.com/docker/compose/releases/download/v2.39.4/docker-compose-linux-x86_64
          curl --fail --location --retry 3 -o docker-compose-linux-x86_64.sha256 https://github.com/docker/compose/releases/download/v2.39.4/docker-compose-linux-x86_64.sha256
          sha256sum -c docker-compose-linux-x86_64.sha256
          install -m 0755 docker-compose-linux-x86_64 /usr/local/lib/docker/cli-plugins/docker-compose
          curl --fail --location --retry 3 -o buildx-v0.28.0.linux-amd64 https://github.com/docker/buildx/releases/download/v0.28.0/buildx-v0.28.0.linux-amd64
          curl --fail --location --retry 3 -o checksums.txt https://github.com/docker/buildx/releases/download/v0.28.0/checksums.txt
          sha256sum --check --ignore-missing checksums.txt
          install -m 0755 buildx-v0.28.0.linux-amd64 /usr/local/lib/docker/cli-plugins/docker-buildx
Outputs:
  InstanceId:
    Value: !Ref Instance
  ArtifactBucket:
    Value: !Ref ArtifactBucket
  Region:
    Value: !Ref AWS::Region
