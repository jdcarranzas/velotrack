# Cloud Build: build image -> push to Artifact Registry -> deploy to Cloud Run
# Ejecutar desde la raíz del repositorio:
#   gcloud builds submit --config velotrack-captura/cloudbuild.yaml \
#     --substitutions=_CLOUDSQL_INSTANCE=PROJECT:REGION:INSTANCE .
# Substitutions: _REGION, _REPO, _SERVICE, _CLOUDSQL_INSTANCE, _DB_NAME, _RUN_SERVICE_ACCOUNT
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - velotrack-captura/
    id: build-image
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}
    id: push-image
    waitFor: [build-image]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --port=8080
      - --memory=1Gi
      - --service-account=${_RUN_SERVICE_ACCOUNT}
      - --add-cloudsql-instances=${_CLOUDSQL_INSTANCE}
      - --set-env-vars=SPRING_DATASOURCE_URL=jdbc:postgresql:///${_DB_NAME}?cloudSqlInstance=${_CLOUDSQL_INSTANCE}&socketFactory=com.google.cloud.sql.postgres.SocketFactory
      - --update-secrets=SPRING_DATASOURCE_USERNAME=talentms-db-user:latest,SPRING_DATASOURCE_PASSWORD=talentms-db-password:latest
      - --allow-unauthenticated
    id: deploy-run
    waitFor: [push-image]
substitutions:
  _REGION: us-east1
  _REPO: velotrack
  _SERVICE: velotrack-captura
  _DB_NAME: capturedb
  _RUN_SERVICE_ACCOUNT: talentms-run@project-1982eff9-e8d4-4e80-914.iam.gserviceaccount.com
  _CLOUDSQL_INSTANCE: PROJECT_ID:REGION:INSTANCE_NAME
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
options:
  logging: CLOUD_LOGGING_ONLY
