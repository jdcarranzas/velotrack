spring:
  application:
    name: velotrack-captura
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/velotrack}
    username: ${DB_USER:velotrack}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000
      data-source-properties:
        socketTimeout: 10
        options: -c statement_timeout=5000
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true
server:
  port: ${PORT:8082}
  shutdown: graceful
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
prototype:
  access:
    username: ${CAPTURE_USERNAME:entrenador}
    password: ${CAPTURE_PASSWORD}
    coach-id: ${COACH_ID:11111111-1111-1111-1111-111111111111}
    team-id: ${TEAM_ID:22222222-2222-2222-2222-222222222222}
    athlete-ids: ${ATHLETE_IDS:33333333-3333-3333-3333-333333333333}
