services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?Configure SPRING_DATASOURCE_URL en .env}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?Configure SPRING_DATASOURCE_USERNAME en .env}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Configure SPRING_DATASOURCE_PASSWORD en .env}
      COACH_ID: ${COACH_ID:-11111111-1111-1111-1111-111111111111}
      TEAM_ID: ${TEAM_ID:-22222222-2222-2222-2222-222222222222}
      ATHLETE_IDS: ${ATHLETE_IDS:-33333333-3333-3333-3333-333333333333}
    ports:
      - "127.0.0.1:${CAPTURE_HOST_PORT:-8082}:8080"
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health/readiness || exit 1"]
      start_period: 60s
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
