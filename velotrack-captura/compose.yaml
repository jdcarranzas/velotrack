services:
  db:
    image: timescale/timescaledb:2.23.1-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: velotrack
      POSTGRES_USER: velotrack
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD en .env}
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velotrack -d velotrack"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 1g
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/velotrack
      DB_USER: velotrack
      DB_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD en .env}
      CAPTURE_USERNAME: ${CAPTURE_USERNAME:-entrenador}
      CAPTURE_PASSWORD: ${CAPTURE_PASSWORD:?Configure CAPTURE_PASSWORD en .env}
      COACH_ID: ${COACH_ID:-11111111-1111-1111-1111-111111111111}
      TEAM_ID: ${TEAM_ID:-22222222-2222-2222-2222-222222222222}
      ATHLETE_IDS: ${ATHLETE_IDS:-33333333-3333-3333-3333-333333333333}
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health/readiness || exit 1"]
      start_period: 60s
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  timescale-data:
