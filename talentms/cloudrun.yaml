# Cloud Run Service for talentms (serverless + Cloud SQL Postgres)
# Deploy with: gcloud run services replace deploy/gcp/cloudrun.yaml --region=$REGION
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: talentms
  annotations:
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/cloudsql-instances: PROJECT_ID:REGION:INSTANCE_NAME
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: talentms-run@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/talentms/talentms:latest # <-- replaced by deploy.sh
          ports:
            - name: h2c
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://localhost:5432/talentms
            - name: SPRING_DATASOURCE_USERNAME
              value: talentms
            - name: SPRING_CLOUD_GCP_SQL_ENABLED
              value: "true"
            - name: SPRING_CLOUD_GCP_SQL_DATABASE_NAME
              value: talentms
            - name: SPRING_CLOUD_GCP_SQL_INSTANCE_CONNECTION_NAME
              value: PROJECT_ID:REGION:INSTANCE_NAME
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: validate
            - name: PUBSUB_ENABLED
              value: "true"
            - name: GCP_PROJECT_ID
              value: PROJECT_ID
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: talentms-db-password
                  key: latest
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            failureThreshold: 10
            periodSeconds: 30
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
  traffic:
    - percent: 100
      latestRevision: true
