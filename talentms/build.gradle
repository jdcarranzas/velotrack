plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.velotrack'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation platform('com.google.cloud:spring-cloud-gcp-dependencies:5.13.1')
    implementation 'com.google.cloud:spring-cloud-gcp-starter-sql-postgresql'
    implementation 'com.google.cloud:google-cloud-pubsub'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.h2database:h2'

    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

// Carga talentms/.env como variables de entorno al correr bootRun (el archivo está en .gitignore).
tasks.named('bootRun') {
    def envFile = file('.env')
    if (envFile.exists()) {
        envFile.eachLine { line ->
            def entry = line.trim()
            if (entry && !entry.startsWith('#') && entry.contains('=')) {
                def parts = entry.split('=', 2)
                environment parts[0].trim(), parts[1].trim()
            }
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
